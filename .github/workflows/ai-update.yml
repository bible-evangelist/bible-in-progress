name: AI Branch Monthly Update

# Workflow that updates the AI branch automatically every month.
# See AI_CONTRIBUTING.md for details.

on:
  schedule:
    # 00:00 UTC on the 1st of each month
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # Manual run is also possible (for smoke testing)

env:
  # Model used by the AI scribe. Override in repo Variables (not Secrets) if you
  # want to switch to a different model without editing this file.
  AI_MODEL: ${{ vars.AI_MODEL || 'claude-opus-4-7' }}

jobs:
  update-ai-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout ai branch
        uses: actions/checkout@v4
        with:
          ref: ai
          fetch-depth: 0

      - name: Fetch human branch for reference
        run: |
          git fetch origin human:human

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic

      - name: Run AI revision script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ env.AI_MODEL }}
        run: |
          python scripts/ai_revise.py

      - name: Configure git for AI commits
        run: |
          git config user.name "ai-scribe"
          git config user.email "ai-scribe@bible-in-progress.local"

      - name: Commit and push if changed
        run: |
          if [[ -n $(git status -s) ]]; then
            DATE=$(date +%Y-%m)
            git add book/
            git commit -m "AI revision: ${DATE} (model: ${AI_MODEL})

          This is an automated revision by ${AI_MODEL}.
          See AI_CONTRIBUTING.md for the philosophy and process.

          Prompt version: $(cat prompts/VERSION 2>/dev/null || echo 'unversioned')
          Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          "
            git push origin ai
          else
            echo "No changes to commit"
          fi

# Required secret:
#   ANTHROPIC_API_KEY
# Configure under Settings -> Secrets and variables -> Actions -> Secrets.
#
# Optional repo variable (Settings -> Secrets and variables -> Actions -> Variables):
#   AI_MODEL  e.g. "claude-sonnet-4-6" to switch from the Opus 4.7 default.
